[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bipartite-scope"
version = "1.0.0"
description = "An explainable attributed bipartite community and association analysis engine."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dongxuan Ge"}]
keywords = ["bipartite-graphs", "community-search", "graph-learning", "explainability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
train = ["torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bipartite-scope = "bipartite_scope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
